<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="AgentTune">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b85333"/>
      <stop offset="1" stop-color="#8f3c23"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <!-- three "tuning" faders of varying level -->
  <g fill="#faf6ef">
    <rect x="21" y="55" width="13" height="24" rx="6.5"/>
    <rect x="43.5" y="29" width="13" height="50" rx="6.5"/>
    <rect x="66" y="45" width="13" height="34" rx="6.5"/>
  </g>
  <!-- fader knobs -->
  <g fill="#1a1a17">
    <circle cx="27.5" cy="55" r="4.4"/>
    <circle cx="50" cy="40" r="4.4"/>
    <circle cx="72.5" cy="51" r="4.4"/>
  </g>
</svg>
