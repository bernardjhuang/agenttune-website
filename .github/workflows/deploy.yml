name: Deploy to Cloudflare Pages

# Triggers a production deploy of agent-tune.com on every push to main.
# Equivalent to running `npm run deploy` locally, but driven by GitHub.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with Cloudflare Pages: Edit permission
#                           (use the "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID — visible in any Cloudflare dashboard sidebar
#
# The Cloudflare Pages project "agent-tune" remains a Direct Upload project;
# this workflow just automates the trigger. Local `npm run deploy` continues
# to work as a backup / for emergency hotfixes.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check quizzes, exports, and consent
        run: npm test

      - name: Build public assets
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=agent-tune --branch=main

      # Tell Bing & friends (the index behind ChatGPT search / Copilot) what
      # changed — submits every sitemap URL via the IndexNow protocol.
      - name: Ping IndexNow
        run: node tools/ping-indexnow.js
