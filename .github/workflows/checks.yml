name: Regression checks
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Build the downloadable React starter
        run: |
          npm ci --prefix examples/enneagram-react --ignore-scripts --no-fund
          npm run build --prefix examples/enneagram-react
      - name: Verify the starter archive matches its source
        run: python3 tools/build-enneagram-starter.py --check
